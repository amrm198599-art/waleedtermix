name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (unzip if needed)
        id: p
        shell: bash
        run: |
          if [ -f settings.gradle.kts ]; then
            D="."
          else
            Z=$(ls -1 *.zip 2>/dev/null | head -1)
            if [ -z "$Z" ]; then echo "No project or zip found in repo root"; exit 1; fi
            rm -rf _proj && mkdir -p _proj && unzip -q "$Z" -d _proj
            F=$(find _proj -name settings.gradle.kts -not -path '*/node_modules/*' | head -1)
            if [ -z "$F" ]; then echo "settings.gradle.kts not found inside $Z"; exit 1; fi
            D=$(dirname "$F")
          fi
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: ${{ steps.p.outputs.dir }}

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Decode and verify keystore
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            && echo "Keystore OK" \
            || { echo "Keystore/alias/password check FAILED"; exit 1; }

      - name: Build release APK (signed)
        working-directory: ${{ steps.p.outputs.dir }}
        shell: bash
        run: |
          gradle assembleRelease --stacktrace \
            -Pandroid.injected.signing.s
