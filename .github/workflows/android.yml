      - name: Prepare web app
        run: |
          ls -la
          mkdir -p unz www
          for z in ./*.zip; do
            d="unz/$(basename "$z" .zip | tr ' ()' '___')"
            mkdir -p "$d"
            unzip -oq "$z" -d "$d"
          done
          IDX="$(find unz -name index.html | head -1)"
          if [ -z "$IDX" ]; then echo "ERROR: no index.html found in any zip"; exit 1; fi
          echo "Using: $IDX"
          cp "$IDX" www/index.html
          ICON="$(find unz -iname app-icon.png | head -1)"
          if [ -z "$ICON" ] && [ -f icon-for-apk.png ]; then ICON=icon-for-apk.png; fi
          if [ -z "$ICON" ]; then echo "ERROR: app-icon.png not found"; exit 1; fi
          cp "$ICON" www/app-icon.png
          cp "$ICON" /tmp/app-icon.png
