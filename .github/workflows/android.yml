name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (unzip if needed)
        id: p
        shell: bash
        run: |
          if [ -f settings.gradle.kts ]; then
            D="."
          else
            Z=$(ls -1 *.zip 2>/dev/null | head -1)
            if [ -z "$Z" ]; then echo "No project or zip found in repo root"; exit 1; fi
            rm -rf _proj && mkdir -p _proj && unzip -q "$Z" -d _proj
            F=$(find _proj -name settings.gradle.kts -not -path '*/node_modules/*' | head -1)
            if [ -z "$F" ]; then echo "settings.gradle.kts not found inside $Z"; exit 1; fi
            D=$(dirname "$F")
          fi
          echo "Project dir: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: ${{ steps.p.outputs.dir }}

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Build release APK (unsigned)
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WaleedRemix-debug
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: WaleedRemix-release-unsigned
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/release/*.apk
