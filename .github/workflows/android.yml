name: Unzip and build signed APK + AAB

# Put this file in the repo at:  .github/workflows/build-from-zip.yml
# Put the project zip (e.g. waled-ai-with-ads.zip) in the repo ROOT, then run it.
on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'Zip file name in the repo root'
        default: 'waled-ai-with-ads.zip'
  push:
    paths:
      - '*.zip'

permissions:
  contents: read

concurrency:
  group: build-from-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZIP_NAME: ${{ github.event.inputs.zip_name || 'waled-ai-with-ads.zip' }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'waleed' }}
      CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          set -e
          [ -f "$ZIP_NAME" ] || { echo "::error::$ZIP_NAME not found in the repo root"; ls -la; exit 1; }
          rm -rf build && mkdir build
          unzip -q "$ZIP_NAME" -d build
          find_pkg() { find build -maxdepth 4 -name package.json -not -path '*/node_modules/*' | head -n1; }
          PKG=$(find_pkg)
          # The zip may contain another zip (nested): unpack it too.
          if [ -z "$PKG" ]; then
            for inner in $(find build -maxdepth 3 -name '*.zip'); do
              unzip -q -o "$inner" -d "$(dirname "$inner")/unzipped"
            done
            PKG=$(find_pkg)
          fi
          [ -n "$PKG" ] || { echo "::error::package.json not found inside the zip"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$PKG")" >> "$GITHUB_ENV"
          echo "Project found in: $(dirname "$PKG")"

      - name: Check signing secrets exist
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STOREPW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYPW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          [ -n "$B64" ]     || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing"; missing=1; }
          [ -n "$STOREPW" ] || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is missing"; missing=1; }
          [ -n "$KEYPW" ]   || { echo "::error::Secret ANDROID_KEY_PASSWORD is missing"; missing=1; }
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # Capacitor 8 requires Node 22+

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: cd "$PROJECT_DIR" && npm install

      - name: Build web app
        run: cd "$PROJECT_DIR" && npx vite build

      - name: Prepare Android project (regenerate if incomplete, signing, AdMob, SDK 36+)
        run: cd "$PROJECT_DIR" && node scripts/android-prepare.mjs

      - name: Sync web assets into Android
        run: cd "$PROJECT_DIR" && npx cap sync android

      - name: Restore keystore
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Verify keystore password and alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD \
            || { echo "::error::Keystore password or alias ('$KEY_ALIAS') is wrong"; exit 1; }

      - name: Set version (always increasing)
        run: |
          CODE=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} + ${{ vars.ANDROID_VERSION_OFFSET || 0 }} ))
          echo "ANDROID_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          APK=$(ls "$PROJECT_DIR"/android/app/build/outputs/apk/release/*.apk | head -n1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Collect APK and AAB
        run: |
          mkdir -p out
          cp "$APK" "out/Waleed-AI-${ANDROID_VERSION_NAME}.apk"
          cp "$PROJECT_DIR/android/app/build/outputs/bundle/release/app-release.aab" "out/Waleed-AI-${ANDROID_VERSION_NAME}.aab"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Waleed-AI-APK-AAB-${{ env.ANDROID_VERSION_NAME }}
          path: out/*
          if-no-files-found: error

      - name: Delete keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
