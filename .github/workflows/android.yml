      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK (signed)
        working-directory: ${{ steps.p.outputs.dir }}
        run: >
          gradle assembleRelease --stacktrace
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore"
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}"
          -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}"
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WaleedRemix-debug
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: WaleedRemix-release-signed
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/release/*.apk
